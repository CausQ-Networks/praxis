<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Praxis Cloud</title>
  <style>
    :root { --text:#18181b; --muted:#52525b; --surface:#f4f4f5; --accent:#0f766e; }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; color: var(--text); line-height: 1.55; }
    h1 { font-size: 2.5rem; letter-spacing: -0.03em; margin: 0 0 0.75rem; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    code { background: var(--surface); padding: 0.15rem 0.4rem; border-radius: 4px; }
    pre { background: var(--surface); padding: 1rem; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Praxis</h1>
  <p>Identity-aware access by CausQ Networks. Control plane hostname: <code>app-praxis.causq.com</code>.</p>
  <p>Cloud hosting for this hostname is being stood up. For local POC:</p>
  <pre>praxis auth login --hostname http://localhost:3002</pre>
  <p>Install CLI: <a href="https://praxis.causq.com/get-cli.sh">praxis.causq.com/get-cli.sh</a></p>
  <p><a href="/discord/">Discord</a> · <a href="/community/">Community</a></p>
</body>
</html>
