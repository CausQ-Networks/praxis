name: Make GHCR packages public

# One-shot (or re-runnable) job to set org container packages public.
# Needs org package admin via GITHUB_TOKEN (packages: write).

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names"
        required: true
        default: "praxis-gerbil,praxis-newt,praxis-node"

permissions:
  packages: write
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
          ORG: CausQ-Networks
        run: |
          set -euo pipefail
          IFS=',' read -ra PKGS <<< "$PACKAGES"
          for pkg in "${PKGS[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            echo "Setting $ORG/$pkg → public"
            # Prefer org visibility endpoint; fall back to listing
            code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/packages/container/${pkg}/visibility" \
              -d '{"visibility":"public"}')
            echo "HTTP $code"
            cat /tmp/out.json
            echo
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              echo "::warning::Failed for $pkg (HTTP $code)"
            fi
          done
